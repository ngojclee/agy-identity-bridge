name: Build CLIProxyAPI Plugin

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run tests
        run: |
          go vet ./src
          go test ./src -v

      - name: Build plugin (.so)
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -buildvcs=false -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X main.pluginVersion=${GITHUB_REF_NAME#v}" \
            -o dist/agy-identity-bridge.so ./src
          rm -f dist/*.h

      - name: Package
        run: |
          cd dist
          VERSION="${GITHUB_REF_NAME#v}"
          sha256sum agy-identity-bridge.so > agy-identity-bridge.so.sha256
          zip "agy-identity-bridge_${VERSION}_linux_amd64.zip" agy-identity-bridge.so agy-identity-bridge.so.sha256

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/agy-identity-bridge_*_linux_amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
